name: Build Windows installer

# 在真正的 Windows 機器上編譯 exe 與安裝程式。
# 手動觸發（Actions 頁面按 Run workflow），或推 v* 標籤時自動發佈 Release。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 預設的 workflow token 是唯讀，推標籤要發佈 Release 必須明寫 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # Windows 主控台預設 cp1252，不設這個的話腳本印出中文會丟 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: 產生應用程式圖示
        working-directory: app
        run: python make_icon.py

      - name: 打包成 exe
        working-directory: app
        run: pyinstaller --clean --noconfirm HSBC_Daily_Report.spec --distpath ../installer/dist

      - name: 確認 exe 真的產出來了
        shell: pwsh
        run: |
          $exe = "installer/dist/HSBC Daily Report.exe"
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          "exe 大小： {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: 冒煙測試（--run 應該因為還沒設定資料來源而失敗，但不可以當掉）
        shell: pwsh
        working-directory: installer/dist
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath ".\HSBC Daily Report.exe" -ArgumentList "--run" -PassThru
          # 不能無限等：視窗程式若跳出對話框或誤開 GUI 會永遠卡住，限時砍掉才看得出問題
          $exited = $p.WaitForExit(90000)

          $logDir = "$env:LOCALAPPDATA\HSBC Daily Report\logs"
          $log = if (Test-Path $logDir) {
            Get-ChildItem "$logDir\run_*.log" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime | Select-Object -Last 1
          }

          if (-not $exited) {
            # 卡住時先把能蒐集到的線索全部印出來，再殺掉
            $p.Refresh()
            "=== 卡住了，診斷資訊 ==="
            "MainWindowTitle: '$($p.MainWindowTitle)'"
            "MainWindowHandle: $($p.MainWindowHandle)"
            # onefile 的視窗屬於子行程，所以也要看所有同名行程
            Get-Process -Name "HSBC Daily Report" -ErrorAction SilentlyContinue |
              Format-Table Id, MainWindowTitle, StartTime -AutoSize | Out-String
            $startup = Join-Path $logDir "startup.log"
            if (Test-Path $startup) { "--- startup.log ---"; Get-Content $startup }
            else { "（連 startup.log 都沒有：卡在 Python 程式碼執行之前）" }
            if ($log) { "--- log ---"; Get-Content $log.FullName } else { "（沒有寫出任何執行 log）" }
            $p.Kill()
            throw "--run 在 90 秒內沒有結束"
          }

          "結束碼：$($p.ExitCode)"
          $startup = Join-Path $logDir "startup.log"
          if (Test-Path $startup) { "--- startup.log ---"; Get-Content $startup }
          if ($log) { "--- log ---"; Get-Content $log.FullName }
          if ($p.ExitCode -ne 1) {
            throw "預期結束碼 1（尚未設定資料來源），實際為 $($p.ExitCode)"
          }
          if (-not $log) { throw "程式沒有寫出執行 log" }

      - name: 安裝 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 取得繁體中文語言檔
        shell: pwsh
        working-directory: installer
        # Chocolatey 裝的 Inno Setup 不含繁中語言檔，從官方原始碼庫抓一份放在旁邊用
        run: |
          $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseTraditional.isl"
          Invoke-WebRequest -Uri $url -OutFile "ChineseTraditional.isl"
          if ((Get-Item "ChineseTraditional.isl").Length -lt 5000) {
            throw "下載到的語言檔太小，可能不是正確的檔案"
          }
          "語言檔大小： {0:N0} bytes" -f (Get-Item "ChineseTraditional.isl").Length

      - name: 編譯安裝程式
        working-directory: installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: 上傳成品
        uses: actions/upload-artifact@v4
        with:
          name: HSBC-Daily-Report-Windows
          path: |
            installer/Output/*.exe
            installer/dist/*.exe
          if-no-files-found: error

      - name: 發佈 Release（推 v* 標籤時）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
